<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unit convertor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="canav">
        <h1>Unit convertor</h1>
        <h1 id="value"></h1>
        <button id="btn">Convert</button><br>
        <div>
            <div class="bar">
            <h4>Length (Meter/ Feet)</h4>
            <p>20 meters = 65.615 feet | 20 feet = 6.096 meters</p>
        </div>
        <div class="bar">
            <h4>volume (Liters / gallons)</h4>
            <p>20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
        </div>
        <div class="bar">
            <h4>Mass (Killograms / Pounds)</h4>
            <p>20 killos = 44.092 pounds | 20 pounds = 9.075 killos</p>
        </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
