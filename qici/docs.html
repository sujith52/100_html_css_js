<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animade Docs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" crossorigin="anonymous"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0f; color: #e2e8f0; }
        .title-font { font-family: 'Space Grotesk', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .sidebar-link {
            transition: all 0.2s ease;
        }
        .sidebar-link:hover {
            background-color: rgba(255,255,255,0.08);
        }
        .active-topic {
            background-color: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-black/90 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-purple-500 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">A</div>
                <span class="text-3xl font-bold tracking-tighter title-font gradient-text">Animade</span>
            </div>
            <div class="text-sm text-gray-400">React Documentation</div>
        </div>
    </nav>

    <div class="flex max-w-7xl mx-auto pt-24">
        
        <!-- Sidebar -->
        <div class="w-80 border-r border-white/10 h-screen overflow-y-auto p-6 fixed">
            <h3 class="uppercase text-xs tracking-widest text-gray-500 mb-6 px-4">REACT FUNDAMENTALS</h3>
            
            <!-- Collapsible Sections -->
            <div class="space-y-8">
                <!-- Basics -->
                <div>
                    <button onclick="toggleSection(this)" class="w-full flex justify-between items-center text-left font-medium text-gray-300 hover:text-white px-4 py-2">
                        <span>React Basics</span>
                        <span class="text-xl transition-transform">›</span>
                    </button>
                    <div class="pl-4 mt-2 space-y-1 text-sm hidden section-content">
                        <!-- Will be populated by JS -->
                    </div>
                </div>

                <!-- Hooks -->
                <div>
                    <button onclick="toggleSection(this)" class="w-full flex justify-between items-center text-left font-medium text-gray-300 hover:text-white px-4 py-2">
                        <span>Hooks</span>
                        <span class="text-xl transition-transform">›</span>
                    </button>
                    <div class="pl-4 mt-2 space-y-1 text-sm hidden section-content">
                        <!-- Will be populated by JS -->
                    </div>
                </div>

                <!-- Performance -->
                <div>
                    <button onclick="toggleSection(this)" class="w-full flex justify-between items-center text-left font-medium text-gray-300 hover:text-white px-4 py-2">
                        <span>Performance</span>
                        <span class="text-xl transition-transform">›</span>
                    </button>
                    <div class="pl-4 mt-2 space-y-1 text-sm hidden section-content">
                        <!-- Will be populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 ml-80 px-8 pb-20" id="main-content">
            <!-- Dynamic content loaded here -->
        </div>
    </div>

    <!-- Next / Prev Navigation -->
    <div class="fixed bottom-8 right-8 flex gap-3 z-50" id="nav-buttons">
        <!-- Generated by JS -->
    </div>

    <script>
        let currentTopicId = 1;
        let allTopics = [];

        // Sample data structure (you can expand this to 30-40 topics later)
        async function loadData() {
            try {
                const res = await fetch('data.json');
                const data = await res.json();
                allTopics = data.topics;
                renderSidebar();
                loadTopic(1); // Load first topic by default
            } catch(e) {
                console.error(e);
                document.getElementById('main-content').innerHTML = `<p class="text-red-400 p-10">Failed to load data.json</p>`;
            }
        }

        function renderSidebar() {
            const sections = {
                "React Basics": allTopics.filter(t => t.id === 1),
                "Hooks": allTopics.filter(t => t.id <= 3),
                "Performance": allTopics.filter(t => t.id === 3)
            };

            document.querySelectorAll('.section-content').forEach((container, index) => {
                const sectionName = Object.keys(sections)[index];
                const topicsInSection = sections[sectionName];

                let html = '';
                topicsInSection.forEach(topic => {
                    html += `
                        <div onclick="loadTopic(${topic.id})" 
                             class="sidebar-link px-4 py-2.5 rounded-xl cursor-pointer text-sm ${topic.id === currentTopicId ? 'active-topic' : ''}">
                            ${topic.title}
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        function toggleSection(btn) {
            const content = btn.nextElementSibling;
            const arrow = btn.querySelector('span:last-child');
            
            content.classList.toggle('hidden');
            arrow.style.transform = content.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(90deg)';
        }

        async function loadTopic(id) {
            currentTopicId = id;
            const topic = allTopics.find(t => t.id === id);
            if (!topic) return;

            const html = `
                <div class="max-w-3xl">
                    <div class="inline-flex items-center gap-2 bg-white/10 px-4 py-1.5 rounded-full text-sm">
                        ${topic.category} • ${topic.difficulty} • ${topic.estimatedTime}
                    </div>
                    
                    <h1 class="text-5xl font-bold title-font leading-none mt-8 mb-6">${topic.title}</h1>
                    <p class="text-xl text-gray-400">${topic.description}</p>

                    <!-- Overview -->
                    <div class="glass-card p-8 rounded-3xl mt-12 mb-12">
                        <h2 class="text-2xl font-semibold mb-6">Overview</h2>
                        <div class="grid md:grid-cols-3 gap-8">
                            <div>
                                <p class="text-blue-400 font-medium mb-2">What is it?</p>
                                <p class="text-gray-400">${topic.overview.what}</p>
                            </div>
                            <div>
                                <p class="text-purple-400 font-medium mb-2">When to use?</p>
                                <p class="text-gray-400">${topic.overview.when}</p>
                            </div>
                            <div>
                                <p class="text-emerald-400 font-medium mb-2">Why use it?</p>
                                <p class="text-gray-400">${topic.overview.why}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Key Concepts -->
                    <div class="mb-12">
                        <h2 class="text-3xl font-bold mb-8">Key Concepts</h2>
                        <div class="space-y-4">
                            ${topic.keyConcepts.map((c, i) => `
                                <div class="glass-card p-6 rounded-3xl flex gap-5">
                                    <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-bold">${i+1}</div>
                                    <div>
                                        <h3 class="font-semibold">${c.title}</h3>
                                        <p class="text-gray-400">${c.description}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Diagram -->
                    <div class="mb-16">
                        <h2 class="text-3xl font-bold mb-3">${topic.diagram.title}</h2>
                        <p class="text-gray-400 mb-8">${topic.diagram.description}</p>
                        <div id="diagram" class="glass-card p-10 rounded-3xl">
                            <div class="space-y-10">
                                ${topic.diagram.steps.map((step, i) => `
                                    <div class="flex gap-6 items-start">
                                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl font-bold border-2 flex-shrink-0"
                                             style="background: ${step.color}20; color: ${step.color}; border-color: ${step.color};">
                                            ${step.step}
                                        </div>
                                        <div class="pt-2">
                                            <h4 class="font-semibold text-xl">${step.title}</h4>
                                            <p class="text-gray-400">${step.description}</p>
                                        </div>
                                    </div>
                                    ${i < topic.diagram.steps.length - 1 ? `<div class="h-12 w-0.5 bg-white/20 ml-6"></div>` : ''}
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Interactive Demo -->
                    <div class="glass-card p-8 rounded-3xl mb-12">
                        <h2 class="text-2xl font-semibold mb-6">${topic.interactiveDemo.title}</h2>
                        <div class="bg-zinc-950 p-6 rounded-2xl font-mono text-sm mb-6 overflow-auto">
                            <pre><code>${topic.interactiveDemo.code}</code></pre>
                        </div>
                        <p class="text-gray-400 mb-6">${topic.interactiveDemo.explanation}</p>
                        <button onclick="triggerDemo()" 
                                class="bg-gradient-to-r from-blue-600 to-purple-600 px-10 py-4 rounded-2xl font-semibold text-lg hover:scale-105 transition">
                            Trigger Demo →
                        </button>
                    </div>

                    <!-- Common Mistakes & Pro Tip -->
                    <div class="grid md:grid-cols-2 gap-8">
                        <div>
                            <h2 class="text-2xl font-semibold text-rose-400 mb-6">Common Mistakes to Avoid</h2>
                            ${topic.commonMistakes.map(m => `
                                <div class="flex gap-4 mb-4 text-gray-400">
                                    <span class="text-rose-500">⚠</span>
                                    <p>${m}</p>
                                </div>
                            `).join('')}
                        </div>
                        <div class="glass-card p-8 rounded-3xl border-l-4 border-emerald-500">
                            <p class="text-emerald-400 font-medium mb-3">💡 PRO TIP</p>
                            <p class="text-gray-300">${topic.proTip}</p>
                        </div>
                    </div>

                    <!-- Next / Prev -->
                    <div class="flex justify-between mt-16 border-t border-white/10 pt-8">
                        <button onclick="prevTopic()" 
                                class="px-6 py-3 rounded-2xl border border-white/20 hover:bg-white/5 transition flex items-center gap-2">
                            ← Previous
                        </button>
                        <button onclick="nextTopic()" 
                                class="px-6 py-3 rounded-2xl bg-white/10 hover:bg-white/20 transition flex items-center gap-2">
                            Next →
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('main-content').innerHTML = html;
            renderSidebar(); // Refresh active state
        }

        function nextTopic() {
            let nextId = currentTopicId + 1;
            if (nextId > allTopics.length) nextId = 1;
            loadTopic(nextId);
        }

        function prevTopic() {
            let prevId = currentTopicId - 1;
            if (prevId < 1) prevId = allTopics.length;
            loadTopic(prevId);
        }

        let demoCount = 0;
        window.triggerDemo = () => {
            demoCount++;
            const toast = document.createElement('div');
            toast.style.cssText = `position:fixed;bottom:30px;right:30px;background:#10b981;color:white;padding:16px 24px;border-radius:9999px;box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.4);`;
            toast.textContent = `Demo triggered ${demoCount} time${demoCount > 1 ? 's' : ''}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        };

        // Initialize
        window.onload = loadData;
    </script>
</body>
</html>
